[redis]
# Redis 主机地址
host = localhost

# Redis 端口
port = 6379

# 密码已迁移至 .env 的 REDIS_PASSWORD（不再存放于本文件）
# Redis 数据库编号 (通常默认是 0)
db = 0

[mysql]
# MySQL 主机地址
host = localhost
# MySQL 端口
port = 3306
# 目标数据库名（慢查询/健康检查的目标库；账号密码见 .env）
database = aiops

[prometheus]
# Prometheus HTTP API 地址
host = localhost
port = 9090

[milvus]
# Milvus 主机地址
host = localhost
# Milvus 端口
port = 19530
# Milvus 数据库名
database_name = itcast
# Milvus 集合名
collection_name = edurag_final
# 向量维度（bge-m3 为 1024）
dim = 1024
